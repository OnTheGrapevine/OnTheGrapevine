                    <figure>
                    <img src="https://cdn.jsdelivr.net/gh/OnTheGrapevine/OnTheGrapevine@main/CDN/graphics/dftaPoster.jpg" alt="Don't Feed The AI poster" style="width: 100%;">
                    <figcaption>
                        <ol>
                            <li><h1>OPT-OUT</h1>
                            a small effort that might not make a difference but takes 3 clicks. on Instagram: click the three lines in the top-right corner to open 'Settings and activity' -> scroll down beneath 'More info and support' and open 'Privacy Centre' -> there are two paragraphs at the top where you will find 'You have the right to object' -> clicking on the word 'object' will open a form where you just have to give your email. unfortunately, there is no garuatnee that Meta will honour your objection but it is worth a try. <br>
                            <br>
                            another thing you can quickly turn off in 'Settings and activity' is: scroll down below 'How others can interact with you' and open 'Sharing and reuse' -> underneath 'Allow people to create with and reuse your original audio on Meta AI' turn it off.
                            <br>
                            <li><h1>POISON</h1>
                            Nightshade is a programme created by Sand Lab, University of Chicago that actively degrades the intellegence of AI training models via turning your images into "poisonous" sample data. It is completely free and easy to use. Here's a link to the official <a href="https://nightshade.cs.uchicago.edu/userguide.html" target="_blank">Nightshade User's Guide</a>.
                            <br>
                            <li><h1>GLAZE</h1>
                            Glaze is also a programme created by Sand Lab, University of Chicago that is free and easy to use. It is a similar programme that works differently by altering your images in a way that is not visible to the human eye but is drastically different to AI. Here's a link to the official <a href="https://glaze.cs.uchicago.edu/userguide.html" target="_blank">Glaze User's Guide</a>.
                            <br>
                            <li><h1>MIGRATE</h1>
                            No matter how much we try to starve AI by making our art more resilient, Big Tech companies will continue to feed them and grow them in ways that will adapt to countermeasures like Nightshade and Glaze faster than they can counter-adapt. It is much better to start migrating now to platforms that garuntee against AI crawling and protect the Copyright of your art. But this has to be a collective cultural shift, as currently Instagram has become a centralised platform for creative marketing, making it difficult to escape from. personally, i have been off Instagram for over a year but stil haven't found an alternative that works for me and have recently made a new Instagram account to better keep up-to-date with organisations i volunteer with or have interests with and to stay in touch with friends who mainly network on there. if you have any suggestions, please forward them in the comments
                            <br>
                            <li><h1>OWN</h1>
                            a profile page that you develop yourself will always be under your own ownership and control. under Meta's terms and conditions, your puiblic posts are already being scraped for training AI models. on the <a href="https://www.gov.uk/government/news/cma-opens-investigation-into-metas-commercial-terms--2">30th October 2026, the CMA opened an investigation</a> on Meta with concerns of them planning to revise these terms to allow AI to also be able to scrape any links to alternate platforms/websites listed on your profile - luckily these plans has been delayed. keeping your art hosted on a website you develop yourself will allow you to directly disallow AI crawlers from viewing your content via the use of a robot.txt file. i personally have been using and would recommend Neocities as they have a premade robot.txt file and, to my knowledge, are the largest indie web hosting platform with a growing social community. there are plenty of templates and tutorials for anyone unfamiliar with code to get started on making your own site. it not only allows you full ownership and control of the website that your art is hosted on, but also has unlimited customiumization and can elevate your online profile into something much more creative, interactive and immersive.
                            <br>
                        </ol>
                    <i>last updated - 01/11/2026</i> </figcaption>
